name: RaceDay - Build, Test and Docker image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          for d in docs RaceDay/RaceDay.Api RaceDay/RaceDay.Contracts RaceDay/RaceDay.Web RaceDay/RaceDay.Api.Tests; do
            if [ ! -d "$d" ]; then
              echo "ERROR: $d folder is missing"
              exit 1
            fi
            echo "$d found"
          done
          for f in RaceDay/RaceDay.slnx RaceDay/RaceDay.Web/Dockerfile; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing"
              exit 1
            fi
            echo "$f found"
          done
          echo "Repository structure is valid."

      # Several SDKs are installed so the build works whichever .NET version the
      # projects target. The newest SDK is used (it can read the .slnx solution file).
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore packages
        working-directory: RaceDay
        run: dotnet restore RaceDay.slnx

      # The solution contains the API, the contracts, the MVC web application and the tests
      - name: Build solution (API and MVC web application)
        working-directory: RaceDay
        run: dotnet build RaceDay.slnx --no-restore --configuration Release

      - name: Run unit tests
        working-directory: RaceDay
        run: dotnet test RaceDay.slnx --no-build --configuration Release --verbosity normal

      # Proves that the Dockerfile of the MVC application builds a working image
      - name: Build Docker image of the MVC web application
        run: docker build -f RaceDay/RaceDay.Web/Dockerfile -t raceday-web RaceDay
